<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Workout Complete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#dbe5d8",
                        "surface-container-low": "#151e16",
                        "on-primary": "#003918",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "secondary-container": "#00e3fd",
                        "on-secondary-fixed-variant": "#004f58",
                        "primary-fixed": "#63ff95",
                        "on-secondary": "#00363d",
                        "background": "#0d150e",
                        "surface-variant": "#2e372e",
                        "on-secondary-fixed": "#001f24",
                        "surface-bright": "#323c32",
                        "tertiary-fixed": "#ffdf92",
                        "on-tertiary": "#3e2e00",
                        "outline-variant": "#3b4a3d",
                        "secondary": "#bdf4ff",
                        "surface": "#0d150e",
                        "surface-container-high": "#232c24",
                        "inverse-surface": "#dbe5d8",
                        "secondary-fixed": "#9cf0ff",
                        "surface-tint": "#00e473",
                        "tertiary-fixed-dim": "#e4c36e",
                        "on-tertiary-container": "#795f13",
                        "on-tertiary-fixed": "#241a00",
                        "on-primary-fixed-variant": "#005225",
                        "on-surface-variant": "#bacbb9",
                        "on-surface": "#dbe5d8",
                        "primary": "#f5fff2",
                        "surface-container-highest": "#2e372e",
                        "primary-container": "#39ff88",
                        "on-tertiary-fixed-variant": "#594400",
                        "inverse-on-surface": "#29332a",
                        "on-error": "#690005",
                        "surface-container-lowest": "#081009",
                        "on-secondary-container": "#00616d",
                        "secondary-fixed-dim": "#00daf3",
                        "on-primary-container": "#007236",
                        "surface-dim": "#0d150e",
                        "outline": "#849584",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#00210b",
                        "tertiary-container": "#ffdc84",
                        "surface-container": "#19221a",
                        "tertiary": "#fffbff",
                        "inverse-primary": "#006d34",
                        "primary-fixed-dim": "#00e473"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "xxl": "48px",
                        "xs": "4px",
                        "gutter": "20px",
                        "xl": "32px",
                        "margin": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-metrics": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-metrics": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0.5px 0.5px 0 rgba(255,255,255,0.1);
        }
        .glass-panel-elevated {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0.5px 0.5px 0 rgba(255,255,255,0.15), inset 0 0 20px rgba(0, 227, 253, 0.05);
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .celebration-anim {
            animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .gradient-bg {
            background: radial-gradient(circle at top right, rgba(57, 255, 136, 0.15) 0%, rgba(13, 21, 14, 1) 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen gradient-bg flex flex-col justify-between pt-12 pb-safe">
<!-- Suppressed Nav: This is a transactional "Success" screen -->
<main class="flex-1 flex flex-col items-center justify-center px-margin max-w-4xl mx-auto w-full z-10 celebration-anim">
<!-- Header -->
<div class="text-center mb-xl">
<span class="material-symbols-outlined text-primary-container text-[64px] mb-sm" style="font-variation-settings: 'FILL' 1;">
                task_alt
            </span>
<h1 class="font-headline-lg text-headline-lg text-primary-container">Workout Complete</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Hypertrophy Block A • Pull Day</p>
</div>
<!-- Primary Metrics -->
<div class="w-full grid grid-cols-3 gap-sm md:gap-md mb-lg">
<div class="glass-panel rounded-xl p-md flex flex-col items-center justify-center">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-xs uppercase tracking-wider">Duration</span>
<span class="font-display-metrics text-display-metrics text-on-background">52<span class="text-on-surface-variant text-headline-lg font-headline-lg">:18</span></span>
</div>
<div class="glass-panel rounded-xl p-md flex flex-col items-center justify-center">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-xs uppercase tracking-wider">Kcal</span>
<span class="font-display-metrics text-display-metrics text-on-background">486</span>
</div>
<div class="glass-panel rounded-xl p-md flex flex-col items-center justify-center">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-xs uppercase tracking-wider">Volume</span>
<span class="font-display-metrics text-display-metrics text-on-background">7.8<span class="text-on-surface-variant font-headline-md text-headline-md">k</span></span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-xs">kg Total</span>
</div>
</div>
<!-- Personal Records (Gold Accent) -->
<div class="w-full mb-xl">
<h2 class="font-label-sm text-label-sm text-on-surface-variant mb-sm uppercase tracking-wider pl-xs">Personal Records</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<div class="glass-panel-elevated rounded-xl p-md flex items-center relative overflow-hidden">
<!-- Subtle Gold Glow -->
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-tertiary-fixed-dim/20 to-transparent pointer-events-none"></div>
<div class="h-12 w-12 rounded-full bg-tertiary-fixed-dim/10 flex items-center justify-center mr-md border border-tertiary-fixed-dim/30">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">
                            trophy
                        </span>
</div>
<div>
<p class="font-body-md text-body-md text-on-background">Deadlift</p>
<p class="font-label-sm text-label-sm text-tertiary-fixed-dim mt-xs">New 1RM: 185 kg</p>
</div>
</div>
<div class="glass-panel-elevated rounded-xl p-md flex items-center relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-tertiary-fixed-dim/20 to-transparent pointer-events-none"></div>
<div class="h-12 w-12 rounded-full bg-tertiary-fixed-dim/10 flex items-center justify-center mr-md border border-tertiary-fixed-dim/30">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">
                            trending_up
                        </span>
</div>
<div>
<p class="font-body-md text-body-md text-on-background">Total Volume</p>
<p class="font-label-sm text-label-sm text-tertiary-fixed-dim mt-xs">Top 5% this month</p>
</div>
</div>
</div>
</div>
</main>
<!-- CTAs -->
<div class="w-full px-margin pb-lg max-w-4xl mx-auto z-10">
<button class="w-full bg-primary-container text-on-primary font-body-md text-body-md font-semibold h-14 rounded-full mb-sm hover:bg-primary-fixed transition-colors active:scale-95">
            Done
        </button>
<button class="w-full glass-panel text-on-background font-body-md text-body-md h-14 rounded-full hover:bg-white/10 transition-colors active:scale-95">
            View Analysis
        </button>
</div>
</body></html>
