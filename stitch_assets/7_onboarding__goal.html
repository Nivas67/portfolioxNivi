<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FITTRACK - Onboarding Goal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#dbe5d8",
                        "surface-container-low": "#151e16",
                        "on-primary": "#003918",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "secondary-container": "#00e3fd",
                        "on-secondary-fixed-variant": "#004f58",
                        "primary-fixed": "#63ff95",
                        "on-secondary": "#00363d",
                        "background": "#0d150e",
                        "surface-variant": "#2e372e",
                        "on-secondary-fixed": "#001f24",
                        "surface-bright": "#323c32",
                        "tertiary-fixed": "#ffdf92",
                        "on-tertiary": "#3e2e00",
                        "outline-variant": "#3b4a3d",
                        "secondary": "#bdf4ff",
                        "surface": "#0d150e",
                        "surface-container-high": "#232c24",
                        "inverse-surface": "#dbe5d8",
                        "secondary-fixed": "#9cf0ff",
                        "surface-tint": "#00e473",
                        "tertiary-fixed-dim": "#e4c36e",
                        "on-tertiary-container": "#795f13",
                        "on-tertiary-fixed": "#241a00",
                        "on-primary-fixed-variant": "#005225",
                        "on-surface-variant": "#bacbb9",
                        "on-surface": "#dbe5d8",
                        "primary": "#f5fff2",
                        "surface-container-highest": "#2e372e",
                        "primary-container": "#39ff88",
                        "on-tertiary-fixed-variant": "#594400",
                        "inverse-on-surface": "#29332a",
                        "on-error": "#690005",
                        "surface-container-lowest": "#081009",
                        "on-secondary-container": "#00616d",
                        "secondary-fixed-dim": "#00daf3",
                        "on-primary-container": "#007236",
                        "surface-dim": "#0d150e",
                        "outline": "#849584",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#00210b",
                        "tertiary-container": "#ffdc84",
                        "surface-container": "#19221a",
                        "tertiary": "#fffbff",
                        "inverse-primary": "#006d34",
                        "primary-fixed-dim": "#00e473"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "xxl": "48px",
                        "xs": "4px",
                        "gutter": "20px",
                        "xl": "32px",
                        "margin": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-metrics": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-metrics": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0.5px 0.5px 0px 0px rgba(255,255,255,0.2);
        }
        .glass-card-active {
            background-color: rgba(255, 255, 255, 0.12);
            border: 2px solid #39ff88;
            box-shadow: inset 4px 4px 15px -5px rgba(57, 255, 136, 0.3), inset 0.5px 0.5px 0px 0px rgba(255,255,255,0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Gradient Setup -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-surface-container-high via-background to-surface-container-low opacity-80 pointer-events-none"></div>
<!-- Onboarding Goal Content -->
<main class="relative z-10 flex-grow flex flex-col px-margin pt-xxl pb-32">
<header class="mb-xl">
<p class="font-label-sm text-label-sm text-primary-container tracking-wider uppercase mb-sm">Step 1 of 3</p>
<h1 class="font-headline-lg text-headline-lg text-on-background">What are you training for?</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Select your primary goal to personalize your experience.</p>
</header>
<div class="flex flex-col gap-md flex-grow">
<!-- Option 1: Build Muscle -->
<button class="glass-card-active rounded-xl p-lg flex items-start gap-md text-left transition-all duration-300 transform active:scale-[0.98]">
<div class="p-sm bg-primary-container/20 rounded-lg text-primary-container shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-background mb-xs">Build Muscle</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Focus on hypertrophy and strength gains.</p>
</div>
</button>
<!-- Option 2: Lose Fat -->
<button class="glass-card rounded-xl p-lg flex items-start gap-md text-left transition-all duration-300 hover:bg-white/10 transform active:scale-[0.98]">
<div class="p-sm bg-white/10 rounded-lg text-on-background shrink-0">
<span class="material-symbols-outlined">local_fire_department</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-background mb-xs">Lose Fat</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Prioritize calorie deficit and cardiovascular endurance.</p>
</div>
</button>
<!-- Option 3: Get Stronger -->
<button class="glass-card rounded-xl p-lg flex items-start gap-md text-left transition-all duration-300 hover:bg-white/10 transform active:scale-[0.98]">
<div class="p-sm bg-white/10 rounded-lg text-on-background shrink-0">
<span class="material-symbols-outlined">weight</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-background mb-xs">Get Stronger</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Maximize power output and 1RM lifts.</p>
</div>
</button>
<!-- Option 4: Improve Athletic Performance -->
<button class="glass-card rounded-xl p-lg flex items-start gap-md text-left transition-all duration-300 hover:bg-white/10 transform active:scale-[0.98]">
<div class="p-sm bg-white/10 rounded-lg text-on-background shrink-0">
<span class="material-symbols-outlined">sprint</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-background mb-xs">Improve Athletic Performance</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Enhance speed, agility, and overall functional fitness.</p>
</div>
</button>
<!-- Option 5: Maintain Fitness -->
<button class="glass-card rounded-xl p-lg flex items-start gap-md text-left transition-all duration-300 hover:bg-white/10 transform active:scale-[0.98]">
<div class="p-sm bg-white/10 rounded-lg text-on-background shrink-0">
<span class="material-symbols-outlined">monitor_heart</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-background mb-xs">Maintain Fitness</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Keep active and sustain your current physical condition.</p>
</div>
</button>
</div>
</main>
<!-- Persistent Bottom Action -->
<div class="fixed bottom-0 w-full p-margin bg-background/90 backdrop-blur-md border-t border-white/10 z-50">
<button class="w-full bg-primary-container text-background font-headline-md text-headline-md py-4 rounded-full transition-transform active:scale-95 flex justify-center items-center gap-2">
            Next
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
