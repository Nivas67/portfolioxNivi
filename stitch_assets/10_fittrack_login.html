<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary-fixed": "#9cf0ff",

                        "surface-container-highest": "#2e372e",
                        "on-tertiary-fixed": "#241a00",

                    "borderRadius": {

                    "spacing": {

                    "fontSize": {

<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        @keyframes cinematicFadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        .animate-cinematic {
            animation: cinematicFadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            will-change: transform, opacity, filter;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-600 { animation-delay: 600ms; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen w-full relative overflow-hidden flex flex-col justify-center items-center">

<div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent z-0 pointer-events-none"></div>
<main class="z-10 relative flex flex-col items-center w-full max-w-[420px] px-margin text-center">
<div class="mb-xxl flex flex-col items-center w-full">
<h1 class="font-display-metrics text-display-metrics text-primary-container tracking-tighter mb-md animate-cinematic delay-100 uppercase" style="text-shadow: 0 0 24px rgba(57, 255, 136, 0.2);">
                FITTRACK
            </h1>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-md animate-cinematic delay-200">
                Train smarter.<br/>Become stronger.
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px] animate-cinematic delay-300">
                Your training, nutrition, recovery, and progress in one place.
            </p>
</div>
<div class="w-full flex flex-col gap-md animate-cinematic delay-400">
<button class="relative w-full h-14 flex items-center justify-center gap-sm rounded-xl bg-white/[0.12] backdrop-blur-[20px] border border-white/[0.18] text-on-surface font-label-sm text-label-sm transition-all duration-300 hover:bg-white/[0.16] hover:border-white/[0.25] active:scale-[0.98] group overflow-hidden">
<div class="absolute inset-0 rounded-xl border-t border-l border-secondary-fixed/50 opacity-60 mix-blend-screen pointer-events-none transition-opacity group-hover:opacity-100"></div>
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">mail</span>
<span>Continue with Google</span>
</button>
<button class="relative w-full h-14 flex items-center justify-center gap-sm rounded-xl bg-white/[0.12] backdrop-blur-[20px] border border-white/[0.18] text-on-surface font-label-sm text-label-sm transition-all duration-300 hover:bg-white/[0.16] hover:border-white/[0.25] active:scale-[0.98] group overflow-hidden">
<div class="absolute inset-0 rounded-xl border-t border-l border-secondary-fixed/50 opacity-60 mix-blend-screen pointer-events-none transition-opacity group-hover:opacity-100"></div>
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">smartphone</span>
<span>Continue with Phone Number</span>
</button>
</div>
<button class="mt-lg h-12 flex items-center justify-center px-lg font-label-sm text-label-sm text-on-surface-variant/60 hover:text-on-surface transition-colors animate-cinematic delay-500">
            Continue as Guest
        </button>
</main>
<footer class="absolute bottom-0 left-0 w-full p-margin z-10 text-center animate-cinematic delay-600">
<p class="font-body-md text-[12px] leading-relaxed text-on-surface-variant/40 max-w-[300px] mx-auto">
            Your data is encrypted and securely stored. We respect your privacy and will never share your personal information.
        </p>
</footer>
</body></html>
