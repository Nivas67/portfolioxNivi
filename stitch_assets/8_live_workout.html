<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Live Workout - FitTrack</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#dbe5d8",
                        "surface-container-low": "#151e16",
                        "on-primary": "#003918",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "secondary-container": "#00e3fd",
                        "on-secondary-fixed-variant": "#004f58",
                        "primary-fixed": "#63ff95",
                        "on-secondary": "#00363d",
                        "background": "#0d150e",
                        "surface-variant": "#2e372e",
                        "on-secondary-fixed": "#001f24",
                        "surface-bright": "#323c32",
                        "tertiary-fixed": "#ffdf92",
                        "on-tertiary": "#3e2e00",
                        "outline-variant": "#3b4a3d",
                        "secondary": "#bdf4ff",
                        "surface": "#0d150e",
                        "surface-container-high": "#232c24",
                        "inverse-surface": "#dbe5d8",
                        "secondary-fixed": "#9cf0ff",
                        "surface-tint": "#00e473",
                        "tertiary-fixed-dim": "#e4c36e",
                        "on-tertiary-container": "#795f13",
                        "on-tertiary-fixed": "#241a00",
                        "on-primary-fixed-variant": "#005225",
                        "on-surface-variant": "#bacbb9",
                        "on-surface": "#dbe5d8",
                        "primary": "#f5fff2",
                        "surface-container-highest": "#2e372e",
                        "primary-container": "#39ff88",
                        "on-tertiary-fixed-variant": "#594400",
                        "inverse-on-surface": "#29332a",
                        "on-error": "#690005",
                        "surface-container-lowest": "#081009",
                        "on-secondary-container": "#00616d",
                        "secondary-fixed-dim": "#00daf3",
                        "on-primary-container": "#007236",
                        "surface-dim": "#0d150e",
                        "outline": "#849584",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#00210b",
                        "tertiary-container": "#ffdc84",
                        "surface-container": "#19221a",
                        "tertiary": "#fffbff",
                        "inverse-primary": "#006d34",
                        "primary-fixed-dim": "#00e473"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "xxl": "48px",
                        "xs": "4px",
                        "gutter": "20px",
                        "xl": "32px",
                        "margin": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-metrics": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]

                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0.5px 0.5px 0 rgba(255, 255, 255, 0.2);
        }
        .glass-active {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0.5px 0.5px 0 rgba(57, 255, 136, 0.3), 0 0 15px rgba(57, 255, 136, 0.1);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }
        .glass-input:focus-within {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Ambient Background Gradient -->
<div class="absolute inset-0 z-0 pointer-events-none" style="background: radial-gradient(circle at 50% 0%, rgba(57, 255, 136, 0.05) 0%, transparent 70%);"></div>
<!-- TopAppBar Semantic Shell: Suppressed due to Transactional/Linear Journey (Live Workout) -->
<!-- Workout Header Canvas -->
<header class="relative z-10 px-margin pt-12 pb-sm flex justify-between items-end border-b border-white/10">
<div>
<h2 class="font-label-sm text-label-sm text-primary-container tracking-widest uppercase mb-1">Live Workout</h2>
<h1 class="font-headline-lg text-headline-lg text-on-surface">PUSH DAY</h1>
</div>
<div class="text-right">
<div class="font-display-metrics text-display-metrics text-on-surface tracking-tighter" id="workout-timer">32:48</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 relative z-10 overflow-y-auto px-margin py-lg pb-32 flex flex-col gap-lg">
<!-- Exercise Header -->
<section class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<h3 class="font-headline-md text-headline-md text-on-surface">Barbell Bench Press</h3>
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-white transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">swap_horiz</span>
</button>
</div>
<!-- History / Target Context -->
<div class="flex gap-sm">
<div class="glass-panel rounded-lg px-3 py-2 flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">history</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Prev: 80kg x 8</span>
</div>
<div class="glass-panel rounded-lg px-3 py-2 flex items-center gap-2 border-primary-container/30">
<span class="material-symbols-outlined text-primary-container text-[16px]">track_changes</span>
<span class="font-label-sm text-label-sm text-primary-container">Target: 82.5kg x 8</span>
</div>
</div>
</section>
<!-- Sets Tracker -->
<section class="flex flex-col gap-2">
<!-- Header Row -->
<div class="grid grid-cols-[32px_1fr_1fr_48px] gap-4 px-4 py-2 border-b border-white/10 mb-2">
<div class="font-label-sm text-label-sm text-on-surface-variant text-center">Set</div>
<div class="font-label-sm text-label-sm text-on-surface-variant text-center">kg</div>
<div class="font-label-sm text-label-sm text-on-surface-variant text-center">Reps</div>
<div class="font-label-sm text-label-sm text-on-surface-variant text-center"><span class="material-symbols-outlined text-[16px]">check</span></div>
</div>
<!-- Set 1 (Completed) -->
<div class="glass-panel rounded-xl grid grid-cols-[32px_1fr_1fr_48px] gap-4 p-4 items-center opacity-60">
<div class="font-headline-md text-headline-md text-on-surface-variant text-center">1</div>
<div class="font-body-lg text-body-lg text-center text-on-surface line-through decoration-white/30">80</div>
<div class="font-body-lg text-body-lg text-center text-on-surface line-through decoration-white/30">8</div>
<div class="flex justify-center">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Set 2 (Completed) -->
<div class="glass-panel rounded-xl grid grid-cols-[32px_1fr_1fr_48px] gap-4 p-4 items-center opacity-60">
<div class="font-headline-md text-headline-md text-on-surface-variant text-center">2</div>
<div class="font-body-lg text-body-lg text-center text-on-surface line-through decoration-white/30">82.5</div>
<div class="font-body-lg text-body-lg text-center text-on-surface line-through decoration-white/30">8</div>
<div class="flex justify-center">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Set 3 (Active) -->
<div class="glass-active rounded-xl grid grid-cols-[32px_1fr_1fr_48px] gap-4 p-4 items-center relative overflow-hidden mt-2 mb-2 scale-[1.02] shadow-lg shadow-black/50">
<!-- Active Indicator Bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container"></div>
<div class="font-headline-md text-headline-md text-primary-container text-center">3</div>
<!-- Weight Input Controls -->
<div class="flex items-center justify-center gap-2">
<button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-on-surface hover:bg-white/10 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<div class="glass-input rounded-lg w-16 h-12 flex items-center justify-center">
<input class="bg-transparent border-none text-center w-full font-headline-md text-headline-md text-on-surface p-0 focus:ring-0 appearance-none" type="number" value="82.5"/>
</div>
<button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-on-surface hover:bg-white/10 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
<!-- Reps Input Controls -->
<div class="flex items-center justify-center gap-2">
<button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-on-surface hover:bg-white/10 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<div class="glass-input rounded-lg w-14 h-12 flex items-center justify-center">
<input class="bg-transparent border-none text-center w-full font-headline-md text-headline-md text-on-surface p-0 focus:ring-0 appearance-none" type="number" value="8"/>
</div>
<button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-on-surface hover:bg-white/10 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
<div class="flex justify-center">
<div class="w-8 h-8 rounded-full border-2 border-primary-container/50 border-dashed animate-[spin_4s_linear_infinite]"></div>
</div>
</div>
<!-- Set 4 (Pending) -->
<div class="glass-panel rounded-xl grid grid-cols-[32px_1fr_1fr_48px] gap-4 p-4 items-center opacity-80">
<div class="font-headline-md text-headline-md text-on-surface-variant text-center">4</div>
<div class="font-body-lg text-body-lg text-center text-on-surface-variant">82.5</div>
<div class="font-body-lg text-body-lg text-center text-on-surface-variant">8</div>
<div class="flex justify-center">
<div class="w-8 h-8 rounded-full border border-white/20"></div>
</div>
</div>
<!-- Add Set Button -->
<button class="py-3 mt-2 flex items-center justify-center gap-2 text-on-surface-variant hover:text-white transition-colors">
<span class="material-symbols-outlined text-[20px]">add</span>
<span class="font-label-sm text-label-sm">Add Set</span>
</button>
</section>
</main>
<!-- Bottom Fixed Action Area -->
<div class="fixed bottom-0 left-0 w-full p-margin pb-safe bg-surface/90 backdrop-blur-xl border-t border-white/5 z-40">
<button class="w-full h-14 bg-primary-container text-[#000000] font-headline-md text-headline-md rounded-xl shadow-[0_0_20px_rgba(57,255,136,0.3)] active:scale-95 transition-transform duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">done_all</span>
            COMPLETE SET
        </button>
</div>
<!-- BottomNavBar Semantic Shell: Suppressed due to Transactional/Linear Journey (Live Workout) -->
<script>
        // Simple timer logic for demonstration
        let seconds = 32 * 60 + 48; // Starting at 32:48
        const timerElement = document.getElementById('workout-timer');
        
        setInterval(() => {
            seconds++;
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerElement.textContent = `${m}:${s}`;
        }, 1000);
    </script>
</body></html>
