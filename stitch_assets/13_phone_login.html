<style>
        body {
            background: radial-gradient(circle at top left, #151e16 0%, #0d150e 100%);
            min-height: 100vh;
            color: #dbe5d8;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0.5px 0.5px 0px rgba(255, 255, 255, 0.2);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }

        .input-glass:focus-within {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Keyboard safe spacing */
        .keyboard-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }

        /* Bottom Sheet Animation */
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .bottom-sheet.active {
            transform: translateY(0);
        }
        
        .otp-input {
            width: 48px;
            height: 56px;
            text-align: center;
        }
        
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md antialiased overflow-hidden flex flex-col h-screen">
<!-- Top Navigation Anchor (Suppressed shell, transactional page) -->
<header class="fixed top-0 w-full flex justify-between items-center px-margin h-16 w-full z-50 bg-transparent">
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-panel hover:bg-white/10 transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-primary-container">FITTRACK</div>
<div class="w-10 h-10"></div> <!-- Balancer -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin pt-32 pb-6 relative z-10">
<!-- Header -->
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Enter your phone number</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We'll send you a secure verification code to sign in.</p>
</div>
<!-- Phone Input Area -->
<div class="glass-panel rounded-xl p-md mb-xl">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-sm uppercase">Mobile Number</label>
<div class="flex items-center gap-sm">
<!-- Country Code Selector (Simulated) -->
<div class="input-glass rounded-[18px] h-14 flex items-center px-4 cursor-pointer hover:bg-white/10 shrink-0">
<span class="text-xl mr-2">🇺🇸</span>
<span class="font-body-md text-body-md text-on-surface">+1</span>
<span class="material-symbols-outlined text-on-surface-variant ml-1 text-sm">expand_more</span>
</div>
<!-- Number Input -->
<div class="input-glass rounded-[18px] h-14 flex-1 flex items-center px-4 relative">
<input autocomplete="tel" class="w-full bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface placeholder:text-white/40 p-0 focus:ring-0" id="phoneInput" maxlength="14" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-1"></div>
<!-- Action Button -->
<div class="keyboard-safe-bottom w-full">
<button class="w-full h-14 bg-primary-container text-black font-body-lg text-body-lg font-semibold rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform" id="continueBtn">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-1/4 right-0 w-96 h-96 bg-primary-container/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-background to-transparent"></div>
</div>
<!-- OTP Bottom Sheet (Initially hidden via CSS transform) -->
<div class="fixed inset-0 z-50 pointer-events-none flex flex-col justify-end" id="otpSheet">
<!-- Backdrop -->
<div class="absolute inset-0 bg-background/80 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-none" id="otpBackdrop"></div>
<!-- Sheet Content -->
<div class="bottom-sheet bg-surface-container-low border-t border-white/12 rounded-t-[32px] w-full pt-2 px-margin pb-8 keyboard-safe-bottom pointer-events-auto relative shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
<!-- Handle -->
<div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-lg cursor-pointer" id="closeSheetBtn"></div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs text-center">Verify Number</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-xl">
                Code sent to <span class="text-on-surface font-semibold" id="displayNumber">+1 (•••) •••-••••</span>
</p>
<!-- OTP Inputs (Bento-style grid) -->
<div class="flex justify-center gap-3 mb-xl">
<input autofocus="" class="otp-input input-glass rounded-[12px] font-headline-md text-headline-md text-on-surface focus:ring-0 focus:border-white/40 bg-white/5 outline-none" maxlength="1" type="number"/>
<input class="otp-input input-glass rounded-[12px] font-headline-md text-headline-md text-on-surface focus:ring-0 focus:border-white/40 bg-white/5 outline-none" maxlength="1" type="number"/>
<input class="otp-input input-glass rounded-[12px] font-headline-md text-headline-md text-on-surface focus:ring-0 focus:border-white/40 bg-white/5 outline-none" maxlength="1" type="number"/>
<input class="otp-input input-glass rounded-[12px] font-headline-md text-headline-md text-on-surface focus:ring-0 focus:border-white/40 bg-white/5 outline-none" maxlength="1" type="number"/>
<input class="otp-input input-glass rounded-[12px] font-headline-md text-headline-md text-on-surface focus:ring-0 focus:border-white/40 bg-white/5 outline-none" maxlength="1" type="number"/>
<input class="otp-input input-glass rounded-[12px] font-headline-md text-headline-md text-on-surface focus:ring-0 focus:border-white/40 bg-white/5 outline-none" maxlength="1" type="number"/>
</div>
<!-- Verification Action -->
<button class="w-full h-14 bg-primary-container text-black font-body-lg text-body-lg font-semibold rounded-xl flex items-center justify-center gap-2 mb-lg active:scale-95 transition-transform">
                Verify &amp; Login
            </button>
<!-- Secondary Actions -->
<div class="flex justify-between items-center px-4">
<button class="font-label-sm text-label-sm text-[#bdf4ff] hover:text-white transition-colors uppercase tracking-wider">
                    Resend Code (0:59)
                </button>
<button class="font-label-sm text-label-sm text-[#bdf4ff] hover:text-white transition-colors uppercase tracking-wider" id="changeNumberBtn">
                    Change Number
                </button>
</div>
</div>
</div>
<script>
        // Simple Phone Formatter
        const phoneInput = document.getElementById('phoneInput');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        // OTP Sheet Logic
        const continueBtn = document.getElementById('continueBtn');
        const otpSheet = document.getElementById('otpSheet');
        const otpBackdrop = document.getElementById('otpBackdrop');
        const closeSheetBtn = document.getElementById('closeSheetBtn');
        const changeNumberBtn = document.getElementById('changeNumberBtn');
        const displayNumber = document.getElementById('displayNumber');

        function openSheet() {
            if(phoneInput.value.length > 5) {
                displayNumber.textContent = "+1 " + phoneInput.value;
            }
            otpSheet.classList.remove('pointer-events-none');
            otpSheet.querySelector('.bottom-sheet').classList.add('active');
            otpBackdrop.classList.remove('opacity-0');
            otpBackdrop.classList.add('pointer-events-auto');
            
            // Focus first OTP input
            setTimeout(() => {
                document.querySelector('.otp-input').focus();
            }, 400);
        }

        function closeSheet() {
            otpSheet.querySelector('.bottom-sheet').classList.remove('active');
            otpBackdrop.classList.add('opacity-0');
            otpBackdrop.classList.remove('pointer-events-auto');
            setTimeout(() => {
                otpSheet.classList.add('pointer-events-none');
            }, 400);
        }

        continueBtn.addEventListener('click', openSheet);
        closeSheetBtn.addEventListener('click', closeSheet);
        changeNumberBtn.addEventListener('click', closeSheet);
        otpBackdrop.addEventListener('click', closeSheet);

        // OTP Input Auto-advance logic
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
