<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Radial Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14343F"/>
      <stop offset="35%" stop-color="#0B2027"/>
      <stop offset="70%" stop-color="#061217"/>
      <stop offset="100%" stop-color="#02080A"/>
    </radialGradient>

    <!-- Electric Mint & Digital Aqua Neon Gradient -->
    <linearGradient id="mintNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DF2CF"/>
      <stop offset="40%" stop-color="#46D9D2"/>
      <stop offset="80%" stop-color="#24A2B8"/>
      <stop offset="100%" stop-color="#106377"/>
    </linearGradient>

    <!-- Monogram Metallic Lighting Gradient -->
    <linearGradient id="monogramGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#EAF8F3"/>
      <stop offset="70%" stop-color="#A2EED6"/>
      <stop offset="100%" stop-color="#46D9D2"/>
    </linearGradient>

    <!-- Deep Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B34"/>
      <stop offset="50%" stop-color="#091A20"/>
      <stop offset="100%" stop-color="#040D10"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Clip Area -->
  <clipPath id="circleClip">
    <circle cx="300" cy="300" r="285"/>
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Base Background Canvas -->
    <rect width="600" height="600" fill="url(#spaceGrad)"/>

    <!-- Subtle Tech Circuit Grid -->
    <circle cx="300" cy="300" r="260" fill="none" stroke="rgba(141, 242, 207, 0.12)" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="300" cy="300" r="235" fill="none" stroke="url(#mintNeon)" stroke-width="2" filter="url(#softGlow)" opacity="0.8"/>
    <circle cx="300" cy="300" r="200" fill="none" stroke="rgba(70, 217, 210, 0.18)" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="160" fill="none" stroke="rgba(141, 242, 207, 0.08)" stroke-width="1" stroke-dasharray="16 4"/>

    <!-- Telemetry Crosshair Axis Lines -->
    <line x1="300" y1="20" x2="300" y2="75" stroke="#8DF2CF" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <line x1="300" y1="525" x2="300" y2="580" stroke="#8DF2CF" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <line x1="20" y1="300" x2="75" y2="300" stroke="#8DF2CF" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <line x1="525" y1="300" x2="580" y2="300" stroke="#8DF2CF" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>

    <!-- Outer Circular Path for Curved Text -->
    <path id="textArcTop" d="M 100,300 A 200,200 0 0,1 500,300" fill="none" stroke="none"/>
    <path id="textArcBottom" d="M 500,300 A 200,200 0 0,1 100,300" fill="none" stroke="none"/>

    <text font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="rgba(141, 242, 207, 0.65)" letter-spacing="4px">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        PEMMA LAKSHMI NIVAS // CSE · AI &amp; ML
      </textPath>
    </text>

    <!-- Center Cyber Shield -->
    <polygon points="300,120 445,205 445,395 300,480 155,395 155,205" fill="url(#shieldGrad)" stroke="url(#mintNeon)" stroke-width="2.5" filter="url(#intenseGlow)"/>

    <!-- Inner Shield Concentric Border -->
    <polygon points="300,145 420,215 420,385 300,455 180,385 180,215" fill="none" stroke="rgba(141, 242, 207, 0.25)" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Center Monogram Initials "LN" -->
    <g font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" text-anchor="middle">
      <text x="300" y="330" font-size="140" fill="url(#monogramGrad)" letter-spacing="6px" filter="url(#intenseGlow)">LN</text>
    </g>

    <!-- Subtitle Capsule Pill Badge -->
    <g transform="translate(195, 375)">
      <rect width="210" height="32" rx="16" fill="#040D10" stroke="#8DF2CF" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="105" y="21" fill="#8DF2CF" font-family="'DM Mono', monospace" font-size="12" font-weight="700" letter-spacing="2.5px" text-anchor="middle">AI / ML ENGINEER</text>
    </g>

    <!-- Satellite Orbit Nodes -->
    <circle cx="300" cy="65" r="4.5" fill="#8DF2CF" filter="url(#intenseGlow)"/>
    <circle cx="535" cy="300" r="4.5" fill="#8DF2CF" filter="url(#intenseGlow)"/>
    <circle cx="300" cy="535" r="4.5" fill="#8DF2CF" filter="url(#intenseGlow)"/>
    <circle cx="65" cy="300" r="4.5" fill="#8DF2CF" filter="url(#intenseGlow)"/>
  </g>

  <!-- Outer Ring Neon Glow Border -->
  <circle cx="300" cy="300" r="285" fill="none" stroke="url(#mintNeon)" stroke-width="3" filter="url(#intenseGlow)" opacity="0.9"/>
  <circle cx="300" cy="300" r="285" fill="none" stroke="#8DF2CF" stroke-width="1.5"/>

  <!-- Live System Badge on Lower Right -->
  <g transform="translate(435, 435)">
    <circle cx="42" cy="42" r="42" fill="#061217" stroke="url(#mintNeon)" stroke-width="2.5" filter="url(#intenseGlow)"/>
    <circle cx="42" cy="42" r="42" fill="#061217" stroke="#8DF2CF" stroke-width="1.5"/>
    <circle cx="26" cy="42" r="5" fill="#8DF2CF" filter="url(#intenseGlow)"/>
    <text x="52" y="47" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5px">PRO</text>
  </g>
</svg>
