<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E24"/>
      <stop offset="50%" stop-color="#102B33"/>
      <stop offset="100%" stop-color="#07151A"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C68A62"/>
      <stop offset="100%" stop-color="#A56842"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2B29D"/>
      <stop offset="100%" stop-color="#9C8B76"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1512"/>
      <stop offset="100%" stop-color="#0A0807"/>
    </linearGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DF2CF"/>
      <stop offset="100%" stop-color="#46D9D2"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="200"/>

  <!-- Subtle Cyber Tech Grid lines -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(141, 242, 207, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#ringGlow)" stroke-width="3" filter="url(#glowFilter)" opacity="0.6"/>
  
  <!-- Outer Ring Base -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#ringGlow)" stroke-width="2.5"/>

  <!-- Character / Stylized Portrait Silhouette -->
  <!-- Shoulders & Jacket -->
  <path d="M70 400 C70 310, 120 280, 200 280 C280 280, 330 310, 330 400 Z" fill="url(#jacketGrad)"/>
  <!-- Shirt -->
  <polygon points="175,280 225,280 215,350 185,350" fill="url(#shirtGrad)"/>
  <!-- Collar -->
  <polygon points="160,280 185,320 200,285 180,275" fill="#FFFFFF"/>
  <polygon points="240,280 215,320 200,285 220,275" fill="#FFFFFF"/>
  <!-- Jacket Lapels -->
  <polygon points="140,280 175,360 160,400 110,360" fill="#B0A08B"/>
  <polygon points="260,280 225,360 240,400 290,360" fill="#B0A08B"/>

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="70" rx="10" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="55" ry="68" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="142" cy="190" rx="9" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="258" cy="190" rx="9" ry="16" fill="url(#skinGrad)"/>

  <!-- Hair Volume -->
  <path d="M142 170 C140 100, 260 100, 258 170 C270 140, 260 110, 230 95 C190 75, 150 100, 142 170 Z" fill="url(#hairGrad)"/>
  <path d="M145 155 C150 120, 250 120, 255 155 C250 135, 230 120, 200 120 C170 120, 150 135, 145 155 Z" fill="url(#hairGrad)"/>

  <!-- Facial Features (Subtle & Clean) -->
  <!-- Eyebrows -->
  <path d="M165 170 Q180 165 190 170" stroke="#1A1512" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M210 170 Q220 165 235 170" stroke="#1A1512" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="178" cy="180" rx="6" ry="4" fill="#1A1512"/>
  <ellipse cx="222" cy="180" rx="6" ry="4" fill="#1A1512"/>
  <circle cx="179" cy="179" r="1.5" fill="#FFFFFF"/>
  <circle cx="223" cy="179" r="1.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M200 180 L197 202 L204 202" stroke="#8C5230" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Mustache & Smile -->
  <path d="M188 214 Q200 211 212 214" stroke="#1A1512" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M188 224 Q200 230 212 224" stroke="#8C5230" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Overlay Tech Badge on Corner -->
  <g transform="translate(290, 290)">
    <circle cx="20" cy="20" r="26" fill="#07151A" stroke="url(#ringGlow)" stroke-width="2"/>
    <text x="20" y="24" fill="#8DF2CF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">AI</text>
  </g>
</svg>
