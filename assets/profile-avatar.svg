<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#12303A"/>
      <stop offset="40%" stop-color="#0A1D24"/>
      <stop offset="80%" stop-color="#051014"/>
      <stop offset="100%" stop-color="#02080A"/>
    </radialGradient>

    <!-- Glowing Electric Mint & Digital Aqua Gradients -->
    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DF2CF"/>
      <stop offset="50%" stop-color="#46D9D2"/>
      <stop offset="100%" stop-color="#249BB2"/>
    </linearGradient>

    <linearGradient id="goldTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#EAF4F0"/>
      <stop offset="100%" stop-color="#8DF2CF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)"/>

  <!-- Outer Concentric Orbit Rings -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="rgba(141, 242, 207, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#neonMint)" stroke-width="2.5" filter="url(#glowEffect)" opacity="0.85"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="rgba(70, 217, 210, 0.2)" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="rgba(141, 242, 207, 0.1)" stroke-width="1" stroke-dasharray="12 4"/>

  <!-- Radar / Crosshair Target Lines -->
  <line x1="250" y1="30" x2="250" y2="70" stroke="#8DF2CF" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="430" x2="250" y2="470" stroke="#8DF2CF" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="250" x2="70" y2="250" stroke="#8DF2CF" stroke-width="2" stroke-linecap="round"/>
  <line x1="430" y1="250" x2="470" y2="250" stroke="#8DF2CF" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Metallic Core Shield -->
  <polygon points="250,110 370,180 370,320 250,390 130,320 130,180" fill="rgba(11, 30, 36, 0.9)" stroke="url(#neonMint)" stroke-width="2" filter="url(#glowEffect)"/>

  <!-- Inner Hexagon Grid Accents -->
  <polygon points="250,135 345,190 345,310 250,365 155,310 155,190" fill="none" stroke="rgba(141, 242, 207, 0.25)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Monogram Initials: LN (Lakshmi Nivas) -->
  <g font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" text-anchor="middle">
    <!-- Main Big Initials -->
    <text x="250" y="275" font-size="108" fill="url(#goldTech)" letter-spacing="4px" filter="url(#glowEffect)">LN</text>
    
    <!-- Subtitle Badge -->
    <rect x="180" y="305" width="140" height="24" rx="12" fill="#07151A" stroke="#8DF2CF" stroke-width="1"/>
    <text x="250" y="321" font-size="11" fill="#8DF2CF" font-family="'DM Mono', monospace" font-weight="700" letter-spacing="2px">AI / ML ENGINEER</text>
  </g>

  <!-- Orbit Nodes / Glowing Satellites -->
  <circle cx="250" cy="35" r="4" fill="#8DF2CF" filter="url(#glowEffect)"/>
  <circle cx="465" cy="250" r="4" fill="#8DF2CF" filter="url(#glowEffect)"/>
  <circle cx="250" cy="465" r="4" fill="#8DF2CF" filter="url(#glowEffect)"/>
  <circle cx="35" cy="250" r="4" fill="#8DF2CF" filter="url(#glowEffect)"/>

  <!-- Live Status Badge on Bottom Right -->
  <g transform="translate(365, 365)">
    <circle cx="32" cy="32" r="34" fill="#07151A" stroke="url(#neonMint)" stroke-width="2" filter="url(#glowEffect)"/>
    <circle cx="20" cy="32" r="4" fill="#8DF2CF" filter="url(#glowEffect)"/>
    <text x="38" y="36" fill="#EAF4F0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" letter-spacing="1px">PRO</text>
  </g>
</svg>
