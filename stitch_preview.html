<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack Performance OS — Google Stitch Project 14028548084288538617</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #081009;
      color: #DBE5D8;
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: rgba(13, 21, 14, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
    }
    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .badge {
      display: inline-block;
      background: rgba(57, 255, 136, 0.15);
      color: #39FF88;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .project-title {
      font-size: 18px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.4px;
    }
    .project-id {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 4px;
      font-family: monospace;
    }

    .screen-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }
    .screen-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 6px;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.7);
    }
    .screen-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #FFFFFF;
    }
    .screen-item.active {
      background: rgba(57, 255, 136, 0.12);
      border-color: rgba(57, 255, 136, 0.35);
      color: #39FF88;
      font-weight: 700;
    }
    .screen-num {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }
    .screen-item.active .screen-num {
      background: #39FF88;
      color: #081009;
    }
    .screen-name {
      font-size: 13px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Preview Canvas */
    .canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top center, rgba(57, 255, 136, 0.05) 0%, transparent 65%), #0d150e;
      position: relative;
    }
    .top-bar {
      height: 60px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(13, 21, 14, 0.6);
      backdrop-filter: blur(20px);
    }
    .current-title {
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .view-toggles {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #39FF88;
      color: #081009;
    }

    .preview-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }

    /* Phone Mockup Frame */
    .phone-mockup {
      width: 410px;
      height: 860px;
      background: #000000;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(57, 255, 136, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .phone-mockup.full {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      padding: 0;
      border: none;
      box-shadow: none;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      background: #0D150E;
    }
    .phone-mockup.full .iframe-wrapper {
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0D150E;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="badge">Google Stitch Synced</span>
      <h2 class="project-title">FitTrack Performance OS</h2>
      <p class="project-id">ID: 14028548084288538617</p>
    </div>

    <div class="screen-list" id="screenList"></div>
  </div>

  <!-- Main Canvas -->
  <div class="canvas">
    <div class="top-bar">
      <div class="current-title" id="currentScreenTitle">FitTrack Dashboard</div>
      <div class="view-toggles">
        <button class="toggle-btn active" id="btnPhone" onclick="setViewMode('phone')">📱 Mobile View</button>
        <button class="toggle-btn" id="btnFull" onclick="setViewMode('full')">🖥️ Full Width</button>
      </div>
    </div>

    <div class="preview-body">
      <div class="phone-mockup" id="phoneMockup">
        <div class="iframe-wrapper">
          <iframe id="screenFrame" src=""></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    const screens = [
      { id: 1, name: "FitTrack Dashboard", file: "./stitch_assets/3_fittrack_dashboard.html" },
      { id: 2, name: "AI Coach (Coach Nivi)", file: "./stitch_assets/2_ai_coach.html" },
      { id: 3, name: "Live Workout Session", file: "./stitch_assets/8_live_workout.html" },
      { id: 4, name: "Workout Analysis & PRs", file: "./stitch_assets/4_workout_analysis.html" },
      { id: 5, name: "Workout Complete Celebration", file: "./stitch_assets/5_workout_complete.html" },
      { id: 6, name: "Recovery & Sleep Dashboard", file: "./stitch_assets/12_recovery_dashboard.html" },
      { id: 7, name: "Workout Calendar & Tiers", file: "./stitch_assets/11_workout_calendar.html" },
      { id: 8, name: "FitTrack Login (Multi-Login)", file: "./stitch_assets/10_fittrack_login.html" },
      { id: 9, name: "Phone Login (OTP Verification)", file: "./stitch_assets/13_phone_login.html" },
      { id: 10, name: "Onboarding & Goal Assessment", file: "./stitch_assets/7_onboarding__goal.html" },
      { id: 11, name: "Splash Screen", file: "./stitch_assets/1_splash_screen.html" },
      { id: 12, name: "FITTRACK Performance App", file: "./stitch_assets/9_fittrack_performance___training_app.html" }
    ];

    let currentIdx = 0;

    function renderScreenList() {
      const listEl = document.getElementById('screenList');
      listEl.innerHTML = '';
      screens.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'screen-item' + (idx === currentIdx ? ' active' : '');
        item.onclick = () => selectScreen(idx);
        item.innerHTML = `
          <div class="screen-num">${s.id}</div>
          <div class="screen-name">${s.name}</div>
        `;
        listEl.appendChild(item);
      });
    }

    function selectScreen(idx) {
      currentIdx = idx;
      renderScreenList();
      const s = screens[idx];
      document.getElementById('currentScreenTitle').textContent = s.name;
      document.getElementById('screenFrame').src = s.file;
    }

    function setViewMode(mode) {
      const mockup = document.getElementById('phoneMockup');
      const btnPhone = document.getElementById('btnPhone');
      const btnFull = document.getElementById('btnFull');
      if (mode === 'full') {
        mockup.classList.add('full');
        btnFull.classList.add('active');
        btnPhone.classList.remove('active');
      } else {
        mockup.classList.remove('full');
        btnPhone.classList.add('active');
        btnFull.classList.remove('active');
      }
    }

    // Init
    renderScreenList();
    selectScreen(0);
  </script>
</body>
</html>
